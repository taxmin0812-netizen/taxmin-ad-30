  <div class="street" aria-hidden="true">

  <div class="stack" id="stack">
    <!-- 첫 전단지(배너 그대로) -->
    <section class="fl main" id="fl0" aria-label="세무사 구함 전단지">
      <i class="tape t1"></i><i class="tape t2"></i>
      <div class="fl-top">
        <p class="wan"><span>세무사 구함</span><i class="mark"></i></p>
        <p class="got">구했습니다!</p>
        <p class="pr"><b>한 달 5만원부터</b><small>부가세 별도</small></p>
        <p class="take">뜯어 가세요<svg viewBox="0 0 24 40" aria-hidden="true"><path d="M12 2c-3 10 3 20 0 34M3 27l9 10 9-10"/></svg></p>
      </div>
      <ul class="tabs deco" aria-hidden="true">
        <li><button class="tab" type="button" tabindex="-1"><span>세무사<br>월 5만원부터</span></button></li>

        <li><button class="tab" type="button" tabindex="-1"><span>세무사<br>월 5만원부터</span></button></li>
      </ul>
    </section>

    <!-- 질문 쪽지 1: 업종 -->
    <section class="fl qf c1" data-q="1" hidden aria-labelledby="qf1">
      <i class="tape t1"></i><i class="tape t2"></i>
      <div class="qh"><span class="qn">쪽지 1</span><h2 class="qq" id="qf1">어떤 일을<br>하세요?</h2></div>
      <svg class="art" viewBox="0 0 300 120" aria-hidden="true">
        <g class="ib"><path d="M20 52h82l-8-22H28z"/><rect x="26" y="52" width="70" height="52"/><rect x="40" y="66" width="20" height="38" class="r"/></g>

      <ul class="tabs" role="group" aria-label="업종 고르기">
        <li><button class="tab" type="button" data-g="A"><span>도소매<br>온라인 판매</span></button></li>

        <li class="sm"><button class="tab" type="button" data-g="X"><span>법인사업자예요</span></button></li>
      </ul>
    </section>

    <!-- 질문 쪽지 2: 직원 -->
    <section class="fl qf c2" data-q="2" hidden aria-labelledby="qf2">
      <i class="tape t1"></i><i class="tape t2"></i>
      <div class="qh"><span class="qn">쪽지 2</span><h2 class="qq" id="qf2">4대보험 직원은<br>몇 명이에요?</h2></div>

        <g class="ib"><circle cx="150" cy="34" r="17" class="r"/><path d="M120 104c0-36 60-36 60 0z" class="r"/></g>

      </svg>
      <ul class="tabs two" role="group" aria-label="직원 수 고르기">
        <li><button class="tab" type="button" data-v="few"><span>없음 ~ 5명</span></button></li>
        <li><button class="tab" type="button" data-v="many"><span>6명 이상</span></button></li>
      </ul>
    </section>

    <!-- 질문 쪽지 3: 매출 -->
    <section class="fl qf c3" data-q="3" hidden aria-labelledby="qf3">
      <i class="tape t1"></i><i class="tape t2"></i>
      <div class="qh"><span class="qn">쪽지 3</span><h2 class="qq sm" id="qf3">작년 매출은요?</h2></div>
      <svg class="art" viewBox="0 0 300 120" aria-hidden="true">
        <g class="ib"><rect x="40" y="74" width="34" height="30"/><rect x="92" y="56" width="34" height="48"/><rect x="144" y="40" width="34" height="64" class="r"/><rect x="196" y="22" width="34" height="82"/></g>
        <path class="ln" d="M30 66 L100 46 L160 32 L250 10"/>
      </svg>
      <ul class="tabs" role="group" aria-label="매출 고르기">
        <li class="wide"><button class="tab" type="button" data-v="low"><span>이하예요<br><small>올해 시작했어도 이쪽</small></span></button></li>
