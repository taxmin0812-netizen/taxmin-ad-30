<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없어요 | 택스민</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/fonts/pretendard.css?v=3a4dd8f1">
<style>
  :root{--ink:#0E2139;--sub:#56637A;--line:#E4E9F2;--accent:#2554F0}
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--ink);font-family:'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;font-size:16px;line-height:1.75;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-underline-offset:3px}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}
  .top{border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;min-height:60px}
  .brand{color:var(--ink);text-decoration:none;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .brand b{color:var(--accent);font-weight:800}
  .brand span{font-weight:600}
  .nf{padding:72px 20px 88px}
  .code{margin:0 0 6px;color:var(--accent);font-size:15px;font-weight:800;letter-spacing:.08em}
  h1{margin:0 0 12px;font-size:30px;line-height:1.3;font-weight:800;letter-spacing:-.025em}
  p{margin:0 0 12px}
  .btn{display:inline-block;margin:16px 0 28px;padding:14px 24px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
  .btn:hover{background:#1B44D6}
  .btn:focus-visible{outline-offset:3px}
  .help{padding-top:18px;border-top:1px solid var(--line);color:var(--sub);font-size:15px}
  .nw{white-space:nowrap}
  @media (max-width:560px){.nf{padding-top:48px} h1{font-size:26px} .btn{display:block;text-align:center}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/">택스<b>민</b></a>
  </div>
</header>

<main class="wrap nf">
  <p class="code">404</p>
  <h1>찾으시는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력되었을 수 있어요.<br>처음 화면에서 기장료 계산과 상담 신청을 하실 수 있어요.</p>
  <a class="btn" href="/">택스민 처음으로</a>
  <p class="help">궁금한 점은 <a href="https://pf.kakao.com/_Mxojqs/chat" target="_blank" rel="noopener">카카오톡 채널 ‘택스민’</a>이나 전화 <a class="nw" href="tel:0507-1428-6446">0507-1428-6446</a>으로 물어보세요.</p>
</main>

</body>
</html>
